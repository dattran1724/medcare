[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medcare-medical-chatbot"
version = "0.1.0"
description = "Validated foundation for medical intake Agent 1"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.115,<1"]
gemini = ["google-genai>=1.50,<3", "python-dotenv>=1,<2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
